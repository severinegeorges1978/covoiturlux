name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl "https://mvsuqyfmntukrynpigdh.supabase.co/rest/v1/" -H "apikey: $ANON_KEY"
